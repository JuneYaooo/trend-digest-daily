# 博主领域配置（agent 读取，脚本不解析本文件）
# 用法：改成你自己的账号定位与领域关键词；删掉本文件则输出通用版日报。
# 关键词用于"话题 ↔ 领域"匹配打分：命中越多匹配度越高，没有命中任何领域的话题进"次级观察"。

blog:
  name: "示例博主"            # 你的账号名（只用于日报署名，可留空）
  platforms: ["公众号", "知乎", "小红书"]   # 你主要发内容的平台，影响选题卡的"适合平台"建议

# 领域列表：按你的内容方向增删；key 为英文短名，label 为日报里显示的中文名
domains:
  - key: ai_tools
    label: "AI 工具与效率"
    keywords: ["AI", "人工智能", "大模型", "GPT", "Agent", "编程", "程序员", "效率", "开源", "Copilot", "Claude", "算法"]
  - key: selfmedia
    label: "自媒体运营"
    keywords: ["流量", "涨粉", "变现", "公众号", "小红书", "抖音", "直播", "运营", "博主", "账号", "带货", "自媒体"]
  - key: career
    label: "职场与个人成长"
    keywords: ["职场", "面试", "裁员", "招聘", "薪资", "副业", "职业", "工作", "应届", "考研", "考公"]

# 数据源开关（agent 据此给 fetch_trends.py 传 --sources；默认即可不用改）
sources:
  default: ["weibo", "zhihu", "baidu", "hn"]      # 默认启用：大陆网络直连可用
  optional: ["reddit", "github_trending"]          # 需代理，加 --sources 时手动带上
