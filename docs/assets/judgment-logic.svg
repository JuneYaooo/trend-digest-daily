<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="t d">
<title id="t">关键判断逻辑</title>
<desc id="d">四个判断：标题字面几乎一样才合并，被包含只标候选；排序用 1/(60+名次) 求和，两个平台同时在榜高于任何单平台第一；本地缓存判断新上榜、连续在榜和回潮；按命中关键词个数给匹配度星级</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF8F0"/><stop offset="1" stop-color="#F6F0FB"/></linearGradient>
<radialGradient id="g1" cx="1200" cy="0" r="480" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FDBA8C" stop-opacity="0.32"/><stop offset="1" stop-color="#FDBA8C" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0" cy="880" r="480" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#C4B5FD" stop-opacity="0.30"/><stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#6D28D9" fill-opacity="0.07"/></pattern>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F97316"/><stop offset="1" stop-color="#E11D48"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4C1D95" flood-opacity="0.06"/><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7C2D12" flood-opacity="0.11"/></filter>
<filter id="shs" x="-30%" y="-40%" width="160%" height="190%"><feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#7C2D12" flood-opacity="0.14"/></filter>
</defs>
<rect width="1280" height="880" rx="24" fill="url(#bg)"/><rect width="1280" height="880" rx="24" fill="url(#dots)"/>
<rect width="1280" height="880" rx="24" fill="url(#g1)"/><rect width="1280" height="880" rx="24" fill="url(#g2)"/>
<g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
<text x="48" y="72" font-size="32" font-weight="800" fill="#1C1426">关键判断逻辑</text>
<rect x="50" y="86" width="64" height="5" rx="2.5" fill="url(#accent)"/>
<text x="48" y="118" font-size="16.5" fill="#6B5A5E">脚本里的四条规则，配上仓库里那次真实运行的例子。</text>

<g transform="translate(40 146)">
<rect width="584" height="340" rx="20" fill="#FFFFFF" filter="url(#sh)"/><rect width="584" height="340" rx="20" fill="none" stroke="#EFE4DA"/>
<rect x="24" y="22" width="32" height="32" rx="10" fill="#FFEDD5"/><text x="40" y="44" font-size="17" font-weight="800" fill="#EA580C" text-anchor="middle">A</text>
<text x="68" y="45" font-size="20" font-weight="800" fill="#1C1426">合并，还是只标候选？</text>
<rect x="24" y="74" width="330" height="34" rx="10" fill="#FBF7F3" stroke="#EFE4DA"/><rect x="30" y="80" width="62" height="22" rx="7" fill="#F04452"/><text x="61" y="95.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">微博#1</text><text x="102" y="96" font-size="14" fill="#2B2230">新华社追问国乒男队怎么了</text><rect x="24" y="116" width="330" height="34" rx="10" fill="#FBF7F3" stroke="#EFE4DA"/><rect x="30" y="122" width="62" height="22" rx="7" fill="#5B5FEF"/><text x="61" y="137.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">百度#21</text><text x="102" y="138" font-size="14" fill="#2B2230">新华社：国乒男队怎么了</text><path d="M354 91h14a10 10 0 0 1 10 10v22a10 10 0 0 1-10 10h-14" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/><circle cx="392" cy="112" r="13" fill="#059669"/><path d="M386 112l4 4 8-8" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="414" y="70" width="148" height="94" rx="12" fill="#ECFDF5" stroke="#059669" stroke-opacity="0.3"/><text x="428" y="94" font-size="16" font-weight="800" fill="#059669">合并成一条</text><text x="428" y="114" font-size="12.5" fill="#6B5A5E" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">相似度 0.909</text><rect x="428" y="126" width="120" height="8" rx="4" fill="#F1ECE6"/><rect x="428" y="126" width="109.1" height="8" rx="4" fill="#059669"/><path d="M536.0 121v18" stroke="#1C1426" stroke-width="2" stroke-linecap="round"/><text x="536.0" y="154" font-size="10.5" fill="#8A7570" text-anchor="middle">线 0.9</text><rect x="24" y="190" width="330" height="34" rx="10" fill="#FBF7F3" stroke="#EFE4DA"/><rect x="30" y="196" width="62" height="22" rx="7" fill="#F04452"/><text x="61" y="211.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">微博#6</text><text x="102" y="212" font-size="14" fill="#2B2230">后会友期提名</text><rect x="24" y="232" width="330" height="34" rx="10" fill="#FBF7F3" stroke="#EFE4DA"/><rect x="30" y="238" width="62" height="22" rx="7" fill="#5B5FEF"/><text x="61" y="253.5" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">百度#8</text><text x="102" y="254" font-size="14" fill="#2B2230">《后会友期》大爆 “泼天富贵”砸向谁</text><path d="M354 207h14a10 10 0 0 1 10 10v22a10 10 0 0 1-10 10h-14" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/><circle cx="392" cy="228" r="13" fill="#D97706"/><text x="392" y="234" font-size="17" font-weight="800" fill="#FFFFFF" text-anchor="middle">?</text><rect x="414" y="186" width="148" height="94" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-opacity="0.3"/><text x="428" y="210" font-size="16" font-weight="800" fill="#D97706">只标候选</text><text x="428" y="230" font-size="12.5" fill="#6B5A5E" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">包含度 0.6</text><rect x="428" y="242" width="120" height="8" rx="4" fill="#F1ECE6"/><rect x="428" y="242" width="72.0" height="8" rx="4" fill="#D97706"/><path d="M500.0 237v18" stroke="#1C1426" stroke-width="2" stroke-linecap="round"/><text x="500.0" y="270" font-size="10.5" fill="#8A7570" text-anchor="middle">线 0.6</text><text x="24" y="320" font-size="13" fill="#8A7570">只比不同平台。字面几乎一样才合并；短标题被长标题包含只提示，交给 Agent 读标题确认。</text>
</g>
<g transform="translate(656 146)">
<rect width="584" height="340" rx="20" fill="#FFFFFF" filter="url(#sh)"/><rect width="584" height="340" rx="20" fill="none" stroke="#EFE4DA"/>
<rect x="24" y="22" width="32" height="32" rx="10" fill="#E0E7FF"/><text x="40" y="44" font-size="17" font-weight="800" fill="#4F46E5" text-anchor="middle">B</text>
<text x="68" y="45" font-size="20" font-weight="800" fill="#1C1426">排序：只看名次，不比热度</text>
<rect x="24" y="68" width="250" height="34" rx="17" fill="#EEF2FF"/><text x="149" y="90.5" font-size="15" font-weight="700" fill="#3730A3" text-anchor="middle" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">得分 = Σ 1 ÷ (60 + 名次)</text><text x="290" y="90" font-size="13" fill="#8A7570">每个在榜平台各算一份，再相加</text><text x="24" y="140" font-size="14.5" font-weight="800" fill="#2B2230">国乒男队</text><rect x="150.0" y="122" width="169.1" height="26" rx="7" fill="#F04452" fill-opacity="1"/><text x="160.0" y="140" font-size="12" font-weight="700" fill="#FFFFFF">微博#1</text><rect x="321.1" y="122" width="126.9" height="26" rx="7" fill="#5B5FEF" fill-opacity="1"/><text x="331.1" y="140" font-size="12" font-weight="700" fill="#FFFFFF">百度#21</text><text x="460.0" y="140" font-size="14" font-weight="800" fill="#1C1426" font-family="'SF Mono',Menlo,Consolas,monospace">0.0287</text><text x="24" y="180" font-size="14.5" font-weight="600" fill="#2B2230">知乎第 1</text><rect x="150.0" y="162" width="169.1" height="26" rx="7" fill="#2F6FEB" fill-opacity="0.85"/><text x="160.0" y="180" font-size="12" font-weight="700" fill="#FFFFFF">知乎#1</text><text x="331.1" y="180" font-size="14" font-weight="800" fill="#8A7570" font-family="'SF Mono',Menlo,Consolas,monospace">0.0164</text><text x="24" y="220" font-size="14.5" font-weight="600" fill="#2B2230">百度第 1</text><rect x="150.0" y="202" width="169.1" height="26" rx="7" fill="#5B5FEF" fill-opacity="0.85"/><text x="160.0" y="220" font-size="12" font-weight="700" fill="#FFFFFF">百度#1</text><text x="331.1" y="220" font-size="14" font-weight="800" fill="#8A7570" font-family="'SF Mono',Menlo,Consolas,monospace">0.0164</text><text x="24" y="260" font-size="14.5" font-weight="600" fill="#2B2230">HN 第 1</text><rect x="150.0" y="242" width="169.1" height="26" rx="7" fill="#FF6A00" fill-opacity="0.85"/><text x="160.0" y="260" font-size="12" font-weight="700" fill="#FFFFFF">HN#1</text><text x="331.1" y="260" font-size="14" font-weight="800" fill="#8A7570" font-family="'SF Mono',Menlo,Consolas,monospace">0.0164</text><g transform="translate(518 118)"><path d="M0 18l3-14 8 7 6-11 6 11 8-7 3 14z" fill="#F59E0B"/><rect x="0" y="19" width="34" height="5" rx="2" fill="#D97706"/></g><path d="M150 114v164" stroke="#C7C2D9" stroke-dasharray="3 4"/><rect x="24" y="284" width="536" height="1" fill="#F1ECE6"/><text x="24" y="306" font-size="13" fill="#8A7570">两个平台同时在榜，胜过任何一个平台的第 1。</text><text x="24" y="326" font-size="13" fill="#8A7570">微博热度值、知乎万热度、HN points 口径不同，从不相加。</text>
</g>
<g transform="translate(40 510)">
<rect width="584" height="340" rx="20" fill="#FFFFFF" filter="url(#sh)"/><rect width="584" height="340" rx="20" fill="none" stroke="#EFE4DA"/>
<rect x="24" y="22" width="32" height="32" rx="10" fill="#D1FAE5"/><text x="40" y="44" font-size="17" font-weight="800" fill="#059669" text-anchor="middle">C</text>
<text x="68" y="45" font-size="20" font-weight="800" fill="#1C1426">新不新：翻一下本地日历</text>
<text x="190" y="84" font-size="12.5" fill="#8A7570" text-anchor="middle">前天</text><text x="242" y="84" font-size="12.5" fill="#8A7570" text-anchor="middle">昨天</text><text x="294" y="84" font-size="12.5" fill="#8A7570" text-anchor="middle">今天</text><text x="24" y="120" font-size="14.5" font-weight="600" fill="#2B2230">缓存里没有</text><rect x="172" y="101" width="36" height="26" rx="7" fill="#F4F1EE"/><rect x="224" y="101" width="36" height="26" rx="7" fill="#F4F1EE"/><rect x="276" y="101" width="36" height="26" rx="7" fill="#E11D48"/><circle cx="294" cy="114" r="4" fill="#FFFFFF"/><path d="M324 114h18" stroke="#CBBFB5" stroke-width="2" stroke-linecap="round"/><path d="M338 109l5 5-5 5" fill="none" stroke="#CBBFB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="352" y="99" width="208" height="30" rx="15" fill="#FFE4E6"/><text x="456" y="119" font-size="13.5" font-weight="700" fill="#E11D48" text-anchor="middle">新上榜 NEW</text><text x="24" y="172" font-size="14.5" font-weight="600" fill="#2B2230">昨天也在榜</text><path d="M242 166H294" stroke="#34D399" stroke-width="4"/><rect x="172" y="153" width="36" height="26" rx="7" fill="#F4F1EE"/><rect x="224" y="153" width="36" height="26" rx="7" fill="#10B981"/><circle cx="242" cy="166" r="4" fill="#FFFFFF"/><rect x="276" y="153" width="36" height="26" rx="7" fill="#10B981"/><circle cx="294" cy="166" r="4" fill="#FFFFFF"/><path d="M324 166h18" stroke="#CBBFB5" stroke-width="2" stroke-linecap="round"/><path d="M338 161l5 5-5 5" fill="none" stroke="#CBBFB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="352" y="151" width="208" height="30" rx="15" fill="#D1FAE5"/><text x="456" y="171" font-size="13.5" font-weight="700" fill="#047857" text-anchor="middle">连续在榜天数 +1</text><text x="24" y="224" font-size="14.5" font-weight="600" fill="#2B2230">今天又跑一次</text><rect x="172" y="205" width="36" height="26" rx="7" fill="#F4F1EE"/><rect x="224" y="205" width="36" height="26" rx="7" fill="#F4F1EE"/><rect x="276" y="205" width="36" height="26" rx="7" fill="#10B981"/><text x="294" y="223" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle" font-family="'SF Mono',Menlo,Consolas,monospace">×2</text><path d="M324 218h18" stroke="#CBBFB5" stroke-width="2" stroke-linecap="round"/><path d="M338 213l5 5-5 5" fill="none" stroke="#CBBFB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="352" y="203" width="208" height="30" rx="15" fill="#F1F5F9"/><text x="456" y="223" font-size="13.5" font-weight="700" fill="#475569" text-anchor="middle">天数不变</text><text x="24" y="276" font-size="14.5" font-weight="600" fill="#2B2230">断了几天又回来</text><path d="M196 256C216 242 268 242 288 256" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3"/><rect x="172" y="257" width="36" height="26" rx="7" fill="#F59E0B"/><circle cx="190" cy="270" r="4" fill="#FFFFFF"/><rect x="224" y="257" width="36" height="26" rx="7" fill="#F4F1EE"/><rect x="276" y="257" width="36" height="26" rx="7" fill="#F59E0B"/><circle cx="294" cy="270" r="4" fill="#FFFFFF"/><path d="M324 270h18" stroke="#CBBFB5" stroke-width="2" stroke-linecap="round"/><path d="M338 265l5 5-5 5" fill="none" stroke="#CBBFB5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="352" y="255" width="208" height="30" rx="15" fill="#FEF3C7"/><text x="456" y="275" font-size="13.5" font-weight="700" fill="#B45309" text-anchor="middle">天数重置为 1，标「回潮」</text><text x="24" y="320" font-size="13" fill="#8A7570">只认 JSON 里的 is_new、streak、gap_days，日报不自己推算。这次运行有 7 条新上榜。</text>
</g>
<g transform="translate(656 510)">
<rect width="584" height="340" rx="20" fill="#FFFFFF" filter="url(#sh)"/><rect width="584" height="340" rx="20" fill="none" stroke="#EFE4DA"/>
<rect x="24" y="22" width="32" height="32" rx="10" fill="#EDE9FE"/><text x="40" y="44" font-size="17" font-weight="800" fill="#7C3AED" text-anchor="middle">D</text>
<text x="68" y="45" font-size="20" font-weight="800" fill="#1C1426">匹配度：数命中的关键词</text>
<rect x="28" y="192" width="72" height="58" rx="10" fill="#DDD6FE"/><text x="64" y="182" font-size="14" fill="#F59E0B" text-anchor="middle" letter-spacing="0.5">★★</text><text x="64" y="272" font-size="13" font-weight="600" fill="#4C1D95" text-anchor="middle">1 个</text><rect x="112" y="158" width="72" height="92" rx="10" fill="#A78BFA"/><text x="148" y="148" font-size="14" fill="#F59E0B" text-anchor="middle" letter-spacing="0.5">★★★</text><text x="148" y="272" font-size="13" font-weight="600" fill="#4C1D95" text-anchor="middle">2–3 个</text><rect x="196" y="124" width="72" height="126" rx="10" fill="#7C3AED"/><text x="232" y="114" font-size="12.5" fill="#F59E0B" text-anchor="middle" letter-spacing="0.5">★★★★ 起</text><text x="232" y="272" font-size="13" font-weight="600" fill="#4C1D95" text-anchor="middle">4 个以上</text><rect x="44" y="86" width="30" height="22" rx="11" fill="#FFFFFF" stroke="#C4B5FD" filter="url(#shs)"/><text x="59.0" y="101.5" font-size="11.5" font-weight="700" fill="#6D28D9" text-anchor="middle">AI</text><rect x="116" y="80" width="40" height="22" rx="11" fill="#FFFFFF" stroke="#C4B5FD" filter="url(#shs)"/><text x="136.0" y="95.5" font-size="11.5" font-weight="700" fill="#6D28D9" text-anchor="middle">职场</text><rect x="196" y="78" width="38" height="22" rx="11" fill="#FFFFFF" stroke="#C4B5FD" filter="url(#shs)"/><text x="215.0" y="93.5" font-size="11.5" font-weight="700" fill="#6D28D9" text-anchor="middle">GPT</text><rect x="300" y="80" width="260" height="78" rx="12" fill="#FBF8FF" stroke="#E9E1FB"/><text x="314" y="106" font-size="14" font-weight="700" fill="#1C1426">微软裁员，Copilot 部门也没躲过</text><text x="314" y="132" font-size="12.5" fill="#6B5A5E">命中 Copilot · 职场 · 裁员</text><text x="546" y="146" font-size="15" fill="#F59E0B" text-anchor="end" letter-spacing="1">★★★</text><rect x="300" y="172" width="260" height="78" rx="12" fill="#FBF8FF" stroke="#E9E1FB"/><text x="314" y="198" font-size="14" font-weight="700" fill="#1C1426">休息日没回工作消息被辞退</text><text x="314" y="224" font-size="12.5" fill="#6B5A5E">只命中「工作」</text><text x="546" y="238" font-size="15" fill="#F59E0B" text-anchor="end" letter-spacing="1">★★</text><text x="24" y="304" font-size="13" fill="#8A7570">没命中关键词的话题最多 ★★，并注明“语义相关”；</text><text x="24" y="326" font-size="13" fill="#8A7570">同星级再按上面的名次得分排。</text>
</g>
</g></svg>