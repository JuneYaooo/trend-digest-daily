<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">每日选题雷达 trend-digest-daily</title>
  <desc id="d">汇总微博、知乎、百度、Hacker News 公开热榜，去重排序、对照你的领域，交出当天能写的选题卡</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EF"/>
      <stop offset="1" stop-color="#F6EEE3"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 210) scale(150)">
      <stop offset="0" stop-color="#EA580C" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#EA580C" stop-opacity="0.02"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C4A1E" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <!-- 左侧文字 -->
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
    <rect x="64" y="62" width="232" height="32" rx="16" fill="#FDE3D0"/>
    <circle cx="84" cy="78" r="5" fill="#EA580C"/>
    <text x="98" y="84" font-size="15" font-weight="600" fill="#9A3412" letter-spacing="1">AGENT SKILL · 自媒体</text>

    <text x="62" y="160" font-size="58" font-weight="800" fill="#1C1917" letter-spacing="2">每日选题雷达</text>
    <text x="66" y="198" font-size="20" fill="#A8A29E" font-family="'SF Mono',Menlo,Consolas,monospace" letter-spacing="1">trend-digest-daily</text>

    <text x="64" y="252" font-size="21" fill="#44403C">一次看完微博、知乎、百度、HN 四个公开热榜，</text>
    <text x="64" y="284" font-size="21" fill="#44403C">按你的领域挑出今天能写的 3–5 个选题。</text>

    <g font-size="15" fill="#57534E">
      <rect x="64" y="322" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#E7DCCD"/>
      <text x="139" y="344" text-anchor="middle">不用账号和 Key</text>
      <rect x="226" y="322" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#E7DCCD"/>
      <text x="301" y="344" text-anchor="middle">每源每天 1 个请求</text>
      <rect x="388" y="322" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#E7DCCD"/>
      <text x="463" y="344" text-anchor="middle">数据只存在本地</text>
    </g>
  </g>

  <!-- 雷达 -->
  <g>
    <circle cx="820" cy="210" r="150" fill="#FFFFFF" fill-opacity="0.55"/>
    <path d="M820 210 L820 60 A150 150 0 0 1 961 159 Z" fill="url(#sweep)"/>
    <g fill="none" stroke="#E2D3C0" stroke-width="1.5">
      <circle cx="820" cy="210" r="150"/>
      <circle cx="820" cy="210" r="100" stroke-dasharray="4 6"/>
      <circle cx="820" cy="210" r="50" stroke-dasharray="4 6"/>
      <line x1="670" y1="210" x2="970" y2="210" stroke-dasharray="2 6"/>
      <line x1="820" y1="60" x2="820" y2="360" stroke-dasharray="2 6"/>
    </g>
    <line x1="820" y1="210" x2="961" y2="159" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="820" cy="210" r="7" fill="#EA580C"/>

    <!-- 信号点 -->
    <circle cx="905" cy="130" r="6" fill="#EA580C"/>
    <circle cx="905" cy="130" r="13" fill="none" stroke="#EA580C" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="760" cy="150" r="4" fill="#C2B4A3"/>
    <circle cx="742" cy="282" r="4" fill="#C2B4A3"/>
    <circle cx="880" cy="300" r="4" fill="#C2B4A3"/>

    <!-- 来源标签 -->
    <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15" font-weight="600">
      <rect x="680" y="96" width="56" height="28" rx="14" fill="#FFFFFF" stroke="#F2C9C9"/>
      <text x="708" y="115" text-anchor="middle" fill="#DC2626">微博</text>
      <rect x="652" y="226" width="56" height="28" rx="14" fill="#FFFFFF" stroke="#BFD7F5"/>
      <text x="680" y="245" text-anchor="middle" fill="#1D64C8">知乎</text>
      <rect x="760" y="318" width="56" height="28" rx="14" fill="#FFFFFF" stroke="#C9CDF5"/>
      <text x="788" y="337" text-anchor="middle" fill="#3B48C4">百度</text>
      <rect x="880" y="64" width="50" height="28" rx="14" fill="#FFFFFF" stroke="#F6D2B4"/>
      <text x="905" y="83" text-anchor="middle" fill="#EA580C">HN</text>
    </g>
  </g>

  <!-- 选题卡 -->
  <g filter="url(#shadow)">
    <rect x="938" y="150" width="210" height="168" rx="14" fill="#FFFFFF"/>
  </g>
  <rect x="938" y="150" width="6" height="168" rx="3" fill="#EA580C"/>
  <g font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
    <text x="962" y="184" font-size="16" font-weight="700" fill="#1C1917">今日选题卡</text>
    <text x="1128" y="184" font-size="14" text-anchor="end" fill="#F59E0B">★★★</text>
    <rect x="962" y="202" width="162" height="9" rx="4.5" fill="#E7E0D6"/>
    <rect x="962" y="220" width="120" height="9" rx="4.5" fill="#EFE9E1"/>
    <rect x="962" y="244" width="64" height="24" rx="6" fill="#FDE3D0"/>
    <text x="994" y="261" font-size="13" text-anchor="middle" fill="#9A3412">热度证据</text>
    <rect x="1034" y="244" width="64" height="24" rx="6" fill="#DDF1EC"/>
    <text x="1066" y="261" font-size="13" text-anchor="middle" fill="#0F766E">切入角度</text>
    <rect x="962" y="276" width="64" height="24" rx="6" fill="#E8EEF9"/>
    <text x="994" y="293" font-size="13" text-anchor="middle" fill="#1D4ED8">时效窗口</text>
    <rect x="1034" y="276" width="64" height="24" rx="6" fill="#F1ECE4"/>
    <text x="1066" y="293" font-size="13" text-anchor="middle" fill="#57534E">原帖链接</text>
  </g>
</svg>
