  <text x="80" y="372" fill="#4A4A46" font-family="Arial, 'PingFang SC', sans-serif" font-size="18">① 真实接口首跑：百度无热度数值却误读出 1/2/3、知乎标签是英文代码 → 按实测结构重写适配器</text>
